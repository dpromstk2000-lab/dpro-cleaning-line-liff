name: STEP DPRO-SYSTEMS-7 Cleaning Operation Demo R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-7-cleaning-operation-demo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clarify cleaning public operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          official_url = "https://dpro-shop.com/systems/cleaning"
          banner = base64.b64decode("").decode("utf-8")
          public_intro = base64.b64decode("").decode("utf-8")
          css_block = base64.b64decode("").decode("utf-8")
          css_marker = "/* DPRO-SYSTEMS-7 CLEANING OPERATION DEMO */"

          public_files = [
              "demo-guide.html",
              "reception.html",
              "staff.html",
              "owner-ipad.html",
              "owner-followup.html",
              "print.html",
              "item-photo.html",
              "item-photo-ipad.html",
              "owner-settings.html",
              "owner.html",
              "member.html",
          ]
          nav_files = [name for name in public_files if name != "member.html"]

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def add_body_class(text, filename):
              match = re.search(r"<body([^>]*)>", text, flags=re.I)
              if not match:
                  raise SystemExit(f"ERROR: body tag not found: {filename}")
              attrs = match.group(1)
              if "operation-demo-page" in attrs:
                  return text
              class_match = re.search(r'class="([^"]*)"', attrs)
              if class_match:
                  updated_attrs = attrs[:class_match.start()] + f'class="{class_match.group(1)} operation-demo-page"' + attrs[class_match.end():]
              else:
                  updated_attrs = attrs + ' class="operation-demo-page"'
              return text[:match.start()] + "<body" + updated_attrs + ">" + text[match.end():]

          def update_title(text, filename):
              match = re.search(r"<title>(.*?)</title>", text, flags=re.I | re.S)
              if not match:
                  raise SystemExit(f"ERROR: title not found: {filename}")
              title = match.group(1).strip()
              if "公開操作デモ" in title:
                  return text
              updated = f"<title>{title}｜公開操作デモ</title>"
              return text[:match.start()] + updated + text[match.end():]

          def add_banner(text, filename):
              if 'class="operation-demo-banner"' in text:
                  return text
              updated, count = re.subn(
                  r"</header>",
                  "</header>\n" + banner,
                  text,
                  count=1,
                  flags=re.I,
              )
              if count != 1:
                  raise SystemExit(f"ERROR: header closing tag not found: {filename}")
              return updated

          def add_css(text, filename):
              if css_marker in text:
                  return text
              if "</style>" not in text:
                  raise SystemExit(f"ERROR: style closing tag not found: {filename}")
              return text.replace("</style>", "\n" + css_block.strip() + "\n</style>", 1)

          def clean_public_navigation(text):
              text = text.replace(
                  'aria-label="DPROクリーニング内部画面"',
                  'aria-label="DPROクリーニング公開操作デモ画面"',
              )
              text = text.replace(">デモガイド</a>", ">画面一覧</a>")
              system_check_pattern = r'<a[^>]*href="system-check\.html[^"]*"[^>]*>\s*システム確認\s*</a>'
              official_link = f'<a class="official-demo-link" href="{official_url}">公式の機能説明</a>'
              if re.search(system_check_pattern, text, flags=re.I):
                  text = re.sub(system_check_pattern, official_link, text, count=1, flags=re.I)
              return text

          for filename in public_files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"ERROR: required file not found: {filename}")

              text = read(filename)
              text = update_title(text, filename)
              text = add_body_class(text, filename)
              text = add_banner(text, filename)
              text = add_css(text, filename)
              text = clean_public_navigation(text)
              text = re.sub(
                  r'<div class="version">\s*STEP CLEANING-18\s*</div>',
                  '<div class="version">PUBLIC OPERATION DEMO</div>',
                  text,
              )
              write(filename, text)

          guide = read("demo-guide.html")

          guide = guide.replace(
              '<div class="subtitle">営業担当用・5分デモガイド</div>',
              '<div class="subtitle">公開操作デモ・画面選択</div>',
          )

          internal_panels = re.compile(
              r'<section class="panel">\s*'
              r'<div class="internal">.*?</section>\s*'
              r'<section class="panel">\s*'
              r'<div class="status-grid">.*?</section>',
              flags=re.S,
          )
          if "public-demo-intro" not in guide:
              guide, count = internal_panels.subn(public_intro, guide, count=1)
              if count != 1:
                  raise SystemExit("ERROR: internal check panels target not found")

          guide = guide.replace(
              '<div class="title-row"><h2>5分で見せる順番</h2><span class="status-note">店舗側の業務改善を中心に説明</span></div>',
              '<div class="title-row"><h2>公開操作デモのおすすめ順</h2><span class="status-note">上から順に開くと業務全体を理解できます</span></div>',
          )
          guide = re.sub(
              r'<div class="time">\d+秒</div>',
              '<div class="time">操作</div>',
              guide,
          )

          check_card_pattern = re.compile(
              r'<article class="screen"><div>✅</div>'
              r'<div class="screen-title">システム確認</div>'
              r'<div class="screen-note">.*?</div>'
              r'<a href="system-check\.html[^"]*">.*?</a></article>',
              flags=re.S,
          )
          official_card = (
              '<article class="screen"><div>📘</div>'
              '<div class="screen-title">公式の機能説明</div>'
              '<div class="screen-note">機能・料金・導入前後を確認</div>'
              f'<a href="{official_url}">開く</a></article>'
          )
          if re.search(check_card_pattern, guide):
              guide = check_card_pattern.sub(official_card, guide, count=1)

          guide = guide.replace(
              '<div class="screen-title">デモガイド</div><div class="screen-note">営業前確認と進行</div>',
              '<div class="screen-title">画面一覧</div><div class="screen-note">公開操作デモの入口</div>',
          )

          sales_panel_pattern = re.compile(
              r'\s*<section class="panel">\s*'
              r'<div class="title-row"><h2>そのまま使える営業トーク</h2>.*?</section>',
              flags=re.S,
          )
          guide = sales_panel_pattern.sub("", guide, count=1)

          manual_panel_pattern = re.compile(
              r'\s*<section class="panel">\s*'
              r'<div class="title-row"><h2>最終確認として残す2項目</h2>.*?</section>',
              flags=re.S,
          )
          guide = manual_panel_pattern.sub("", guide, count=1)

          internal_script_pattern = re.compile(
              r'\s*<div id="toast" class="toast"></div>\s*'
              r'<script>.*?</script>',
              flags=re.S,
          )
          guide = internal_script_pattern.sub("", guide, count=1)

          write("demo-guide.html", guide)

          for filename in public_files:
              content = read(filename)
              assert "operation-demo-page" in content, filename
              assert 'class="operation-demo-banner"' in content, filename
              assert official_url in content, filename
              assert css_marker in content, filename
              assert "公開操作デモ" in re.search(r"<title>(.*?)</title>", content, flags=re.S).group(1), filename
              assert '<div class="version">STEP CLEANING-18</div>' not in content, filename

          for filename in nav_files:
              content = read(filename)
              assert not re.search(
                  r'<a[^>]*href="system-check\.html[^"]*"[^>]*>\s*システム確認\s*</a>',
                  content,
                  flags=re.I,
              ), filename
              assert "公式の機能説明" in content, filename

          guide = read("demo-guide.html")
          assert "公開操作デモのおすすめ順" in guide
          assert "デモ管理コード" in guide
          assert "1234" in guide
          assert "営業担当・店舗責任者向けの内部画面" not in guide
          assert "営業前チェック" not in guide
          assert "詳細チェック" not in guide
          assert "そのまま使える営業トーク" not in guide
          assert "最終確認として残す2項目" not in guide
          assert 'id="adminKey"' not in guide
          assert "public-demo-intro" in guide

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo-guide.html reception.html staff.html owner-ipad.html owner-followup.html print.html item-photo.html item-photo-ipad.html owner-settings.html owner.html member.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-7-R2 clarify cleaning operation demo"
          git push
